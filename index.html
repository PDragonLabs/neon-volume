<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON VOLUME • Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .title { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        input:focus { box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5); }
        .result { animation: pop 0.3s ease; }
        @keyframes pop { 0% { transform: scale(0.95); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-3xl">📦</div>
                <div>
                    <h1 class="title text-4xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">NEON VOLUME</h1>
                    <p class="text-zinc-400 text-sm">3D Shape Calculator</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleUnits()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-xl flex items-center gap-2 text-sm">
                    <i class="fas fa-exchange-alt"></i>
                    <span id="unit-mode">METRIC</span>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Shape Selector -->
            <div class="lg:col-span-1 glass rounded-3xl p-6 h-fit">
                <h2 class="text-xl font-semibold mb-4 flex items-center gap-2"><i class="fas fa-cube"></i> Select Shape</h2>
                <div class="space-y-2 max-h-[600px] overflow-y-auto pr-2" id="shape-list">
                    <!-- Populated by JS -->
                </div>
            </div>

            <!-- Inputs & Result -->
            <div class="lg:col-span-2 glass rounded-3xl p-8">
                <div id="shape-header" class="flex items-center gap-4 mb-8">
                    <div id="shape-icon" class="text-6xl">📦</div>
                    <div>
                        <h2 id="shape-name" class="text-3xl font-bold title">Cube</h2>
                        <p id="shape-desc" class="text-zinc-400">Regular hexahedron</p>
                    </div>
                </div>

                <div id="inputs" class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-10">
                    <!-- Dynamic inputs populated by JS -->
                </div>

                <div class="border-t border-zinc-700 pt-8">
                    <div class="flex justify-between items-end">
                        <div>
                            <p class="text-zinc-400 text-sm">VOLUME</p>
                            <div id="volume" class="text-6xl font-bold title tracking-tighter text-emerald-400 result">0.000</div>
                            <p id="unit-display" class="text-xl text-zinc-400">cm³</p>
                        </div>
                        <button onclick="calculateVolume()" 
                                class="px-10 py-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 rounded-2xl font-semibold text-lg flex items-center gap-3 transition-all active:scale-95">
                            <i class="fas fa-calculator"></i>
                            CALCULATE
                        </button>
                    </div>
                </div>

                <!-- Formula -->
                <div class="mt-8 text-xs bg-black/50 p-4 rounded-2xl font-mono text-amber-300" id="formula">
                </div>
            </div>
        </div>

        <footer class="text-center text-zinc-500 text-xs mt-12">
            Built as a fun standalone tool • Real-time • Works offline
        </footer>
    </div>

    <script>
        let currentShape = 'cube';
        let isMetric = true;

        const shapes = {
            cube: { name: "Cube", icon: "🧊", desc: "Regular hexahedron", formula: "V = a³", inputs: ["Edge (a)"] },
            rectangular: { name: "Rectangular Prism", icon: "📦", desc: "Box / Tank", formula: "V = l × w × h", inputs: ["Length", "Width", "Height"] },
            sphere: { name: "Sphere", icon: "⚪", desc: "Perfect ball", formula: "V = (4/3)πr³", inputs: ["Radius"] },
            cylinder: { name: "Cylinder", icon: "🥫", desc: "Tube with circular base", formula: "V = πr²h", inputs: ["Radius", "Height"] },
            cone: { name: "Cone", icon: "🍦", desc: "Right circular cone", formula: "V = (1/3)πr²h", inputs: ["Radius", "Height"] },
            pyramid: { name: "Square Pyramid", icon: "🏛️", desc: "Base is square", formula: "V = (1/3) × base² × h", inputs: ["Base Edge", "Height"] },
            ellipsoid: { name: "Ellipsoid", icon: "🥚", desc: "Stretched sphere", formula: "V = (4/3)πabc", inputs: ["Axis a", "Axis b", "Axis c"] },
            capsule: { name: "Capsule", icon: "💊", desc: "Cylinder + hemispheres", formula: "V = πr²h + (4/3)πr³", inputs: ["Radius", "Cylinder Height"] }
        };

        function populateShapes() {
            const container = document.getElementById('shape-list');
            container.innerHTML = '';
            Object.keys(shapes).forEach(key => {
                const s = shapes[key];
                const div = document.createElement('div');
                div.className = `p-4 rounded-2xl flex gap-4 items-center cursor-pointer transition-all hover:bg-white/10 ${currentShape === key ? 'bg-white/10 ring-2 ring-blue-500' : ''}`;
                div.innerHTML = `
                    <div class="text-4xl">${s.icon}</div>
                    <div>
                        <div class="font-semibold">${s.name}</div>
                        <div class="text-xs text-zinc-400">${s.desc}</div>
                    </div>
                `;
                div.onclick = () => {
                    currentShape = key;
                    populateShapes();
                    renderInputs();
                };
                container.appendChild(div);
            });
        }

        function renderInputs() {
            const container = document.getElementById('inputs');
            const shape = shapes[currentShape];
            container.innerHTML = '';

            document.getElementById('shape-icon').textContent = shape.icon;
            document.getElementById('shape-name').textContent = shape.name;
            document.getElementById('shape-desc').textContent = shape.desc;
            document.getElementById('formula').textContent = shape.formula;

            shape.inputs.forEach((label, i) => {
                const div = document.createElement('div');
                div.innerHTML = `
                    <label class="block text-sm text-zinc-400 mb-2">${label} (${isMetric ? 'cm' : 'in'})</label>
                    <input type="number" id="input-${i}" 
                           class="w-full bg-zinc-900 border border-zinc-700 focus:border-blue-500 rounded-2xl px-5 py-4 text-2xl outline-none transition-all"
                           oninput="calculateVolume()" value="${i === 0 ? 10 : 5}">
                `;
                container.appendChild(div);
            });
        }

        function toggleUnits() {
            isMetric = !isMetric;
            document.getElementById('unit-mode').textContent = isMetric ? 'METRIC' : 'IMPERIAL';
            renderInputs();
            calculateVolume();
        }

        function calculateVolume() {
            const shape = shapes[currentShape];
            const inputs = Array.from(document.querySelectorAll('#inputs input')).map(i => parseFloat(i.value) || 0);
            let volume = 0;

            const factor = isMetric ? 1 : 2.54; // rough conversion for display

            switch(currentShape) {
                case 'cube':
                    volume = Math.pow(inputs[0], 3);
                    break;
                case 'rectangular':
                    volume = inputs[0] * inputs[1] * inputs[2];
                    break;
                case 'sphere':
                    volume = (4/3) * Math.PI * Math.pow(inputs[0], 3);
                    break;
                case 'cylinder':
                    volume = Math.PI * Math.pow(inputs[0], 2) * inputs[1];
                    break;
                case 'cone':
                    volume = (1/3) * Math.PI * Math.pow(inputs[0], 2) * inputs[1];
                    break;
                case 'pyramid':
                    volume = (1/3) * Math.pow(inputs[0], 2) * inputs[1];
                    break;
                case 'ellipsoid':
                    volume = (4/3) * Math.PI * inputs[0] * inputs[1] * inputs[2];
                    break;
                case 'capsule':
                    volume = Math.PI * Math.pow(inputs[0], 2) * inputs[1] + (4/3) * Math.PI * Math.pow(inputs[0], 3);
                    break;
            }

            document.getElementById('volume').textContent = volume.toFixed(3);
            document.getElementById('unit-display').textContent = isMetric ? 'cm³' : 'in³';
        }

        // Initialize
        window.onload = () => {
            populateShapes();
            renderInputs();
            calculateVolume();
        };
    </script>
</body>
</html>
